<!doctype html>
<html lang="pt-BR">
<head>

<meta property="og:title" content="Craquefoot">

<meta name="robots" content="noindex">
<link rel="icon" href="../../img/craquefoot.jpg">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #231A4E; color: #FFF4E0; font-family: system-ui, sans-serif; text-align: center; }
  main { padding: 24px 16px; }
  img { width: 96px; height: 96px; border-radius: 22px; }
  h1 { font-size: 20px; margin: 14px 0 6px; }
  p { color: #B9B0DA; margin: 0 0 20px; }
  a { display: inline-block; background: #FFD447; color: #231A4E; font-weight: 800; text-decoration: none; padding: 12px 22px; border-radius: 12px; margin: 4px; }

<body>
<main>
  <img src="../../img/craquefoot.jpg" alt="">

<script>

  location.replace(document.getElementById(/android/i.test(navigator.userAgent) ? 'android' : 'ios').href);
