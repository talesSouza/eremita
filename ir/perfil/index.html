<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perfil Secreto: Jogo de Dicas</title>
<meta name="description" content="Dez dicas, uma resposta. Grátis na App Store.">
<meta property="og:title" content="Perfil Secreto: Jogo de Dicas">
<meta property="og:description" content="Dez dicas, uma resposta. Grátis na App Store.">
<meta property="og:image" content="https://talessouza.github.io/eremita/img/banner-perfilsecreto.jpg">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#231A4E">
<link rel="icon" href="../../img/perfilsecreto.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --noite: #231A4E; --cartao: #2E2563; --borda: #3B3178; --manto: #F25C54; --lanterna: #FFD447; --creme: #FFF4E0; --apagado: #B9B0DA; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--noite); color: var(--creme); font-family: Nunito, system-ui, sans-serif; min-height: 100vh; -webkit-font-smoothing: antialiased; }
  main { max-width: 440px; margin: 0 auto; padding: 28px 16px 40px; }
  .jogo { background: var(--cartao); border: 1px solid var(--borda); border-radius: 22px; overflow: hidden; }
  .banner img { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; object-fit: cover; }
  .corpo { padding: 0 16px 16px; }
  .topo { position: relative; display: flex; gap: 14px; align-items: flex-end; margin-top: -30px; }
  .icone { width: 72px; height: 72px; border-radius: 17px; flex: none; display: block; box-shadow: 0 0 0 4px var(--cartao); }
  .nome { font-weight: 900; font-size: 21px; line-height: 1.15; }
  .nota { color: var(--lanterna); font-weight: 800; font-size: 14px; margin-top: 3px; }
  .nota span { color: var(--apagado); font-weight: 600; }
  .sobre { opacity: .86; font-weight: 600; font-size: 15px; line-height: 1.45; margin: 12px 0 16px; }
  .baixar { display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--manto); color: #fff; text-decoration: none; border-radius: 14px; padding: 13px 16px; font-weight: 800; font-size: 17px; }
  .baixar + .baixar { margin-top: 8px; background: transparent; border: 1px solid var(--borda); color: var(--creme); }
  .baixar svg { width: 20px; height: 20px; flex: none; }
  .abrindo { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--apagado); font-weight: 700; font-size: 14px; margin-top: 14px; }
  .abrindo::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--borda); border-top-color: var(--lanterna); animation: gira .8s linear infinite; }
  .abrindo[hidden] { display: none; }
  @keyframes gira { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .abrindo::before { animation: none; } }
  footer { text-align: center; margin-top: 22px; }
  footer a { color: var(--apagado); font-weight: 700; font-size: 14px; text-decoration: none; }
</style>
</head>
<body>
<main>
  <section class="jogo">
    <div class="banner"><img src="../../img/banner-perfilsecreto.jpg" width="960" height="640" alt="Letreiro PERFIL aceso em vermelho sobre as fichas de dica"></div>
    <div class="corpo">
      <div class="topo">
        <img class="icone" src="../../img/perfilsecreto.jpg" alt="">
        <div>
          <p class="nome">Perfil Secreto</p>
          <p class="nota">★ <b>5,0</b> <span>· grátis na App Store</span></p>
        </div>
      </div>
      <p class="sobre">Um segredo por carta. Dez dicas, da mais vaga à quase óbvia. Quem adivinha primeiro, com menos dicas, leva mais pontos.</p>
      <a class="baixar" id="loja" href="https://apps.apple.com/app/apple-store/id6799121116?pt=126727673&ct=reel-finados&mt=8">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.37 12.6c-.02-2.3 1.88-3.4 1.96-3.46-1.07-1.56-2.73-1.78-3.32-1.8-1.41-.14-2.76.83-3.48.83-.72 0-1.82-.81-3-.79-1.54.02-2.97.9-3.76 2.28-1.6 2.78-.41 6.9 1.15 9.16.76 1.1 1.67 2.34 2.86 2.3 1.15-.05 1.58-.74 2.97-.74 1.38 0 1.78.74 2.99.72 1.24-.02 2.02-1.12 2.77-2.23.88-1.28 1.24-2.52 1.26-2.59-.03-.01-2.4-.92-2.42-3.66zM14.1 5.86c.63-.77 1.06-1.83.94-2.89-.91.04-2.02.61-2.67 1.37-.58.67-1.1 1.76-.96 2.8 1.02.08 2.06-.52 2.69-1.28z"/></svg>
        Baixar grátis na App Store
      </a>
      <p class="abrindo" id="abrindo">Abrindo a loja…</p>
    </div>
  </section>
  <footer><a href="../../">Mais jogos da Eremita</a></footer>
</main>
<script>
  // Página de passagem do anúncio: abre a App Store na hora. Com #ver no endereço, fica parada (para conferir o visual).
  if (location.hash !== '#ver') location.replace(document.getElementById('loja').href);
  else document.getElementById('abrindo').hidden = true;
</script>
</body>
</html>
